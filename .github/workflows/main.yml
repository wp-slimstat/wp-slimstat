name: Deploy to WordPress.org
on:
  push:
    tags:
    - "*"
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest

    steps:
    # PINNED TO A COMMIT, not to @v4 and certainly not to @master. This job holds the SVN
    # credentials for a plugin with ~70,000 active installs, and a tag push is the one event
    # that makes it run — so whatever a moving ref points at on the day someone cuts a tag is
    # what gets those credentials. A tag is a moving ref too: `v4` is republished on every
    # 4.x release, and an account compromise upstream reaches this job without a commit here.
    #
    # 11d5960 is actions/checkout v4.4.0, which is what v4 resolved to when this was pinned.
    # Bumping it is a deliberate edit with a diff someone reviews, which is the property.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # A tag workflow cannot `needs:` across workflow files, so the gate asks GitHub about
    # the tagged commit and fails closed: no green, no deploy. Before this step existed, a
    # tag on a red commit shipped to WordPress.org with no reference to CI at all. Pinned by
    # tests/perf-gate-integrity-test.php.
    #
    # SCOPED TO ONE WORKFLOW RUN, not to the commit's check-run list. The nightly cron
    # starts CI on the default branch every night, and every if:-skipped job records ANOTHER
    # check run against the same SHA — master HEAD carries ~700 of them, 69 of which are
    # `skipped  Static analysis · PHPStan`. Any assertion over that list is an assertion over
    # the pile: `[...] | unique | join(",")` yields "skipped,success" and refuses EVERY
    # deploy. (A count-based variant is worse than useless here: `--paginate` applies `--jq`
    # per page, so it emits one number per page and `[ "20\n20\n25" -lt 7 ]` is a shell error,
    # not a comparison — the check never fires at all.)
    #
    # EXPECTED LANES ARE DERIVED FROM ci.yml at this commit, so there is no number to drift:
    # bump the PHP matrix and the gate follows. The derivation lives in .github/expected-lanes.sh
    # rather than inline here, because a derivation inlined in a workflow can only be READ, and
    # every gate in this repository that was only read turned out to be wrong in a way reading
    # did not show. As a script it is EXECUTED by tests/perf-gate-integrity-test.php §5b, which
    # computes the same set from ci.yml through a different reader and requires exact agreement.
    #
    # TIER 2 IS NOW REQUIRED, for the lanes that carry the blocking escaping gate. It was
    # excluded for two stated reasons, and neither survived the lanes it was excluded from:
    #
    #   "its E2E assertions are continue-on-error, so requiring it would gate on lane setup
    #   rather than on the E2E result" — true of the E2E step, and irrelevant to the job's
    #   conclusion. Tier 2 also carries `Reports output-escaping gate`, which is blocking and
    #   is THE ONLY CI HOME tests/reports-output-escaping-test.php has: it is in
    #   `composer test:all`, no job runs test:all, so outside that step its XSS assertions over
    #   the report render path run nowhere. A commit whose XSS gate failed had a red Tier 2 job
    #   and a green deploy gate. Requiring Tier 1 + PHPStan is what let it ship.
    #
    #   "it is ref-gated to master/main/development, so a tag cut from any other commit carries
    #   a `skipped` conclusion that would refuse the deploy forever" — the ref-gate said `main`
    #   in a repository whose default branch is master and which has never had a main, so at the
    #   time that reason was written Tier 2 did not run on the release branch at all. It does
    #   now. A tag cut from a commit that was never pushed to master/main/development is a
    #   release that never ran the release gates, and refusing it is the correct outcome, not a
    #   deadlock: push the commit to one of those branches and the run exists.
    #
    # Interior WP lanes (5.6…6.9) stay out: their only blocking content is compat setup, and
    # their E2E step is continue-on-error, so requiring them would gate the release on lane
    # setup — which IS the objection above, applied where it holds.
    #
    # NOTHING IS WRITTEN INTO THE WORKSPACE. Both files below used to be redirected into the
    # checkout root as ./jobs.json and ./expected.txt. The deploy step underneath rsyncs this
    # checkout to the wordpress.org SVN repository with .distignore as its only exclusion list,
    # and neither name is in it — so every tag would have published two CI scratch files to
    # ~70,000 installs. $RUNNER_TEMP is outside the checkout, which closes the class instead of
    # adding two more names to a list that has to be remembered.
    - name: Require green Tier 1, static analysis and the blocking Tier 2 lanes for this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        run_id=$(gh api \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1" \
          --jq '.workflow_runs[0].id // empty')
        if [ -z "$run_id" ]; then
          echo "deploy refused: no push-triggered CI run found for ${GITHUB_SHA}"
          exit 1
        fi
        echo "Gating on CI run ${run_id} for ${GITHUB_SHA}"

        gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
          --paginate --slurp > "${RUNNER_TEMP:?}/jobs.json"

        bash .github/expected-lanes.sh > "${RUNNER_TEMP:?}/expected.txt"

        echo "Expected lanes:"; cat "${RUNNER_TEMP:?}/expected.txt"

        fail=0
        while read -r want; do
          got=$(jq -r --arg n "$want" \
            '[.[].jobs[] | select(.name == $n) | .conclusion] | unique | join(",")' "${RUNNER_TEMP:?}/jobs.json")
          if [ "$got" != "success" ]; then
            echo "deploy refused: '${want}' concluded [${got:-absent}]"
            fail=1
          fi
        done < "${RUNNER_TEMP:?}/expected.txt"
        [ "$fail" -eq 0 ] || exit 1
        echo "All expected lanes concluded success."

    - name: Install required dependencies
      run: sudo apt-get update && sudo apt-get install -y subversion

    - name: WordPress Plugin Deploy
      # 54bd289 is the commit the `stable` BRANCH pointed at when this was pinned, and it is
      # the same commit as tag 2.3.0 — so this froze the action without changing what runs.
      # `stable` is a branch: every push to it would otherwise have shipped straight into the
      # step that publishes to the WordPress.org SVN repository.
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SLUG: wp-slimstat
