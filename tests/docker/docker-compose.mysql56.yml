# Override for mysql:5.6 cells. Two differences from the base file, both mandatory:
#   - no arm64 image → the DB service runs emulated (wp stays native);
#   - the base command passes --default-authentication-plugin, a variable that does not
#     exist before 5.7 — 5.6's mysqld refuses to START on an unknown option, so the
#     command is redefined here without it (auth on 5.6 is mysql_native_password anyway).
services:
  db:
    platform: linux/amd64
    command:
      - --max_allowed_packet=64M
